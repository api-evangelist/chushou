description: Chushou (触手TV / 触手直播) was a China-based mobile game live-streaming
  platform, at one point among the largest mobile-focused game streaming services in
  China, letting players broadcast and watch mobile gameplay. It was backed by Qiming
  Venture Partners and Tencent and is surfaced here as a portfolio lead. As of this
  enrichment pass the company's public web presence at chushou.tv is unreachable (the
  server returns empty replies) and it exposes no documented developer API, SDK, or
  portal, so this profile remains an inactive/defunct lead with no live API surface to
  enrich beyond DNS/TLS-level signals.
